version: '3.8'

services:
  # 1. Database MySQL
  mysql-db:
    image: mysql:8.0
    container_name: game-mysql
    environment:
      MYSQL_DATABASE: game_doan_so
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    # Healthcheck: Chờ MySQL thực sự sẵn sàng nhận kết nối
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s    # Kiểm tra mỗi 10 giây
      timeout: 5s      # Timeout mỗi lần check
      retries: 5       # Thử lại tối đa 5 lần trước khi báo unhealthy
      start_period: 30s  # Cho MySQL 30s để khởi động trước khi bắt đầu check

  # 2. Redis Cache
  redis-cache:
    image: redis:7-alpine
    container_name: game-redis
    ports:
      - "6379:6379"
    # Healthcheck: Chờ Redis thực sự sẵn sàng
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 3. Backend Spring Boot
  backend:
    build:
      context: ./guess-game
    container_name: game-backend
    ports:
      - "8080:8080"
    # Chờ MySQL và Redis HEALTHY rồi mới khởi động backend
    depends_on:
      mysql-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/game_doan_so?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_DATA_REDIS_HOST=game-redis
      - SPRING_DATA_REDIS_PORT=6379

  # 4. Frontend Vue
  frontend:
    build:
      context: ./guess-game-ui
    container_name: game-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql_data:
